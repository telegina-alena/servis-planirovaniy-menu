
<div class="card">
    <div class="card-body">

        <h2 class="card-title">
            {{ dish.name|default:"Без названия" }}  
        </h2>

        <p class="card-text">
            <strong>Калорийность:</strong>
            {{ dish.calories }} ккал
        </p>

        <p class="card-text">
            <strong>Приём пищи:</strong>
            {{ dish.meal }}
        </p>

        <a
            href="{% url 'dishes:detail' dish.id %}"
            class="btn btn-primary"
        >
            Подробнее
        </a>

    </div>
</div>
