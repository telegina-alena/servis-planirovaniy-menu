
{% extends "base.html" %}

{% block title %}
Блюда — Кулинарная книга
{% endblock %}

{% block content %}

<h1 class="mb-3">Список блюд</h1>
<p class="text-muted">
    Всего блюд: {{ dishes|length }}
</p>
<div class="row">
    {% for dish in dishes %}
        <div class="col-12 mb-3">
            {% include "dishes/includes/dish_card.html" %}
        </div>
    {% empty %}
        <div class="col-12">
            <p class="text-muted">Блюд пока нет.</p>
        </div>
    {% endfor %}
</div>

{% endblock %}
