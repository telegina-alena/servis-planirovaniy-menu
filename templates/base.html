
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Кулинарная книга{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand bg-light border-bottom mb-4">
        <div class="container">
            <div class="navbar-nav">
                <a class="nav-link {% if request.path == '/' %}active fw-semibold{% endif %}"
                   href="/">
                    Главная
                </a>

                <a class="nav-link {% if request.path|slice:':8' == '/dishes/' %}active fw-semibold{% endif %}"
                   href="/dishes/">
                    Блюда
                </a>

                <a class="nav-link {% if request.path|slice:':13' == '/ingredients/' %}active fw-semibold{% endif %}"
                   href="/ingredients/">
                    Ингредиенты
                </a>

                <a class="nav-link {% if request.path|slice:':7' == '/meals/' %}active fw-semibold{% endif %}"
                   href="/meals/">
                    Приёмы пищи
                </a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
