
{% extends "base.html" %}

{% block title %}
Ингредиенты — Кулинарная книга
{% endblock %}

{% block content %}

<h1 class="mb-3">Список ингредиентов</h1>

<div class="row">
    {% for ingredient in ingredients %}
        <div class="col-12 mb-3">
            {% include "ingredients/includes/ingredient_card.html" %}
        </div>
    {% empty %}
        <div class="col-12">
            <p class="text-muted">Ингредиентов пока нет.</p>
        </div>
    {% endfor %}
</div>

{% endblock %}
